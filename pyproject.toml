[project]
name = "humetrix"
version = "0.2.0"
description = "Automatic metrics for evaluation of humorous content"
authors = [
    {name = "Marcio Lima Inácio", email = "mlinacio@dei.uc.pt"},
]
readme = "README.md"
license = {text = "MIT"}
license-files = ["LICENSE"]
keywords = ["humor", "computational humor", "nlp", "natural language processing",
            "nlg", "natural language generation", "evaluation"]
classifiers = [
    "Private :: Do Not Upload",
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.12"
dependencies = [
    "datasets>=3.5.0",
    "polars-u64-idx>=1.30.0",
    "polars[rt64]>=1.27.1",
    "pyspark>=3.5.5",
    "torch>=2.6.0",
    "transformers>=4.49.0",
    "gensim>=4.3.3",
    "en-core-web-sm",
    "es-core-news-sm",
    "zh-core-web-sm",
    "fr-core-news-sm",
    "pt-core-news-sm",
    "en-core-web-trf",
    "fr-dep-news-trf",
    "es-dep-news-trf",
    "pt-core-news-lg",
    "zh-core-web-trf",
    "ipython>=9.6.0",
    "seaborn>=0.13.2",
    "jupyter>=1.1.1",
    "matplotlib>=3.10.7",
    "python-dotenv>=1.1.1",
    "statsmodels>=0.14.5",
    "accelerate>=1.11.0",
    "scikit-posthocs>=0.11.4",
    "func-timeout>=4.3.5",
    "spacy[cuda12x]>=3.8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
dev-dependencies = [
    "huggingface-hub[hf-xet]>=0.30.2",
    "isort>=6.0.1",
    "numpydoc>=1.9.0",
    "pip>=25.0.1",
    "ruff>=0.5.5",
]

[[tool.uv.index]]
name = "pytorch"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch" }
en-core-web-sm = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl" }
